<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>分形 · 载入页 Demo（Si 原子 Canvas 3D）</title>
<style>
  :root {
    --bg-root: #0e1116;
    --bg-elevated: #1a1f28;
    --border-dim: rgba(148, 163, 184, 0.12);
    --accent: #0ea5e9;
    --accent-glow: rgba(14, 165, 233, 0.35);
    --text-muted: #94a3b8;
    --font-mono: "Cascadia Code", "JetBrains Mono", Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0d12; font-family: var(--font-mono); color: var(--text-muted); }

  .boot {
    position: relative; height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    background: var(--bg-root); overflow: hidden;
  }
  .boot::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(to bottom, transparent 0 2px, rgba(148,163,184,.025) 2px 3px);
    z-index: 2;
  }
  .boot-grid {
    position: absolute; inset: -50%;
    background-image:
      linear-gradient(rgba(94, 234, 212, 0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(94, 234, 212, 0.06) 1px, transparent 1px);
    background-size: 34px 34px;
    animation: boot-grid-scroll 2.6s linear infinite;
  }
  @keyframes boot-grid-scroll { from { transform: translateY(0); } to { transform: translateY(34px); } }
  .boot-scan {
    position: absolute; top: 0; left: 0; right: 0; height: 72px;
    background: linear-gradient(to bottom, rgba(94, 234, 212, 0.09), transparent);
    animation: boot-scan-float 3.8s ease-in-out infinite alternate;
  }
  @keyframes boot-scan-float { from { transform: translateY(-72px); opacity: 0.5; } to { transform: translateY(0); opacity: 1; } }
  .boot-center { position: relative; display: flex; flex-direction: column; align-items: center; gap: 16px; z-index: 1; }

  /* Canvas 原子容器 */
  .si-atom { position: relative; width: 230px; height: 230px; }
  .si-atom canvas { display: block; width: 100%; height: 100%; }

  /* ─────── 进度条 ─────── */
  .boot-progress { position: relative; width: 300px; height: 5px; border-radius: 3px; background: var(--bg-elevated); border: 1px solid var(--border-dim); }
  .boot-progress-fill {
    height: 100%; border-radius: 3px; position: relative;
    background: linear-gradient(90deg, var(--accent-glow), var(--accent));
    box-shadow: 0 0 10px var(--accent-glow);
    transition: width 0.45s ease;
  }
  .boot-progress-fill::after {
    content: ''; position: absolute; right: 0; top: 50%; width: 7px; height: 7px;
    transform: translate(50%, -50%); border-radius: 50%; background: #fff; box-shadow: 0 0 8px var(--accent);
  }
  .boot-progress-pct { position: absolute; right: -38px; top: 50%; transform: translateY(-50%); font-size: 10px; color: var(--text-muted); }

  /* ─────── 假终端日志 ─────── */
  .boot-terminal {
    width: 340px; height: 160px; padding: 10px 12px; border-radius: 10px;
    background: rgba(0,0,0,.35); border: 1px solid var(--border-dim);
    font-size: 10.5px; line-height: 1.75; overflow: hidden; text-align: left;
    box-shadow: inset 0 0 24px rgba(0,0,0,.5);
  }
  .boot-line { animation: boot-line-in 220ms ease-out both; white-space: nowrap; }
  .boot-line--decor { color: rgba(148,163,184,.55); }
  .boot-caret { margin-right: 6px; }
  .boot-caret--accent { color: var(--accent); text-shadow: 0 0 6px var(--accent-glow); }
  @keyframes boot-line-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .boot-cursor {
    display: inline-block; width: 6px; height: 10px; margin-top: 3px; vertical-align: middle;
    background: var(--accent); box-shadow: 0 0 6px var(--accent);
    animation: boot-cursor-blink 0.9s steps(2) infinite;
  }
  @keyframes boot-cursor-blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }

  .boot-footer { position: absolute; bottom: 18px; font-size: 10px; color: rgba(148,163,184,.45); }
  .boot-replay {
    position: absolute; bottom: 44px; padding: 6px 14px; border-radius: 8px;
    border: 1px solid var(--border-dim); background: var(--bg-elevated); color: var(--accent);
    font-size: 11px; cursor: pointer; z-index: 3; font-family: var(--font-mono);
  }
  .boot-replay:hover { background: rgba(14,165,233,.12); }
</style>
</head>
<body>
<div class="boot">
  <div class="boot-grid" aria-hidden="true"></div>
  <div class="boot-scan" aria-hidden="true"></div>

  <div class="boot-center">
    <!-- Si 原子：Canvas 3D（电子=真球体径向渐变 + 近大远小 + 深度遮挡 + 眼睛环顾） -->
    <div class="si-atom" id="atomWrap"><canvas id="atom" width="460" height="460"></canvas></div>

    <!-- 进度条 -->
    <div class="boot-progress" role="progressbar">
      <div class="boot-progress-fill" id="pfill" style="width:0%"></div>
      <span class="boot-progress-pct" id="ppct">0%</span>
    </div>

    <!-- 假终端日志 -->
    <div class="boot-terminal" id="term">
      <span class="boot-cursor"></span>
    </div>
  </div>

  <div class="boot-footer">分形 v0.1.0 · OC 引擎 v1.18.15 · 硅基之心</div>
  <button class="boot-replay" onclick="replay()">↻ 重播载入过程</button>
</div>

<script>
// ═══════════ Canvas 3D Si 原子（数学投影渲染）═══════════
// 轨道 = 3D 空间圆环（绕 Y 主轴 0/120/240° 分布 + 俯视 68°），电子在环上匀速公转；
// 投影 = 旋转矩阵 + 透视除法（近大远小）；电子画成径向渐变球体——任意角度都是圆（CSS 平面圆做不到）；
// 分层绘制：轨道后半段 + 后电子 → 核 → 轨道前半段 + 前电子（真 3D 遮挡）
const W = 460, H = 460, CX = 230, CY = 230;
const canvas = document.getElementById('atom');
const ctx = canvas.getContext('2d');
// 注意：不 scale！坐标系保持 460×460 物理像素（CX=230 即画布中心），
// CSS width:100% 缩到 230css 显示（2x 细腻度）——scale 会把坐标系压成 0..230 导致原子画到右下角（2026-08-09 实测）

const ROT_X = Math.PI * 0.42;   // 俯视角 ≈75.6°（轨道椭圆开口大小——调小=更平更宽）
const PERSP = 560;              // 透视距离（越小透视越强）
const WOBBLE_AMP = 0.16;        // 整体摇摆幅度（±9.2°）

// 轨道定义：r 半径 / tiltY 主轴（绕 Y 旋转）/ speed 公转速度(rad/s) / n 电子数 / phase 起始角
const ORBITS = [
  { r: 100, tiltY: 0,        speed: 0.50, n: 4, phase: 0.0 },
  { r: 78,  tiltY: 2.094,    speed: 0.90, n: 8, phase: 0.4 },
  { r: 52,  tiltY: 4.189,    speed: 1.95, n: 2, phase: 1.2 },
];
const NUCLEUS_R = 25;          // 核半径（css 50px / 2）
const PUPIL_R = 12;            // 瞳孔半径
const GLINT_X = -11, GLINT_Y = -11; // 高光位置（核内左上）

// 轨道 3D 点：轨道圆在 XY 平面，先绕 Y 旋转 tiltY（主轴朝向），返回 3D 坐标
function orbitPoint(r, tiltY, theta) {
  const x = r * Math.cos(theta);
  const y = r * Math.sin(theta);
  const z = 0;
  // 绕 Y 轴：主轴朝向
  const x2 = x * Math.cos(tiltY) + z * Math.sin(tiltY);
  const z2 = -x * Math.sin(tiltY) + z * Math.cos(tiltY);
  return [x2, y, z2];
}

// 投影：绕 Y（摇摆）→ 绕 X（俯视）→ 透视
function project(p, wobble) {
  const [x, y, z] = p;
  const x1 = x * Math.cos(wobble) + z * Math.sin(wobble);
  const z1 = -x * Math.sin(wobble) + z * Math.cos(wobble);
  const y1 = y * Math.cos(ROT_X) - z1 * Math.sin(ROT_X);
  const z2 = y * Math.sin(ROT_X) + z1 * Math.cos(ROT_X);
  const scale = PERSP / (PERSP + z2);
  return { x: CX + x1 * scale, y: CY + y1 * scale, z: z2, s: scale };
}

// 画轨道（分段：z<0 后半先画在核下，z>0 前半后画在核上）
function drawOrbit(o, wobble, alpha) {
  ctx.beginPath();
  ctx.strokeStyle = `rgba(125, 211, 252, ${alpha})`;
  ctx.lineWidth = 1.6;
  const STEPS = 72;
  let started = false;
  for (let i = 0; i <= STEPS; i++) {
    const th = (i / STEPS) * Math.PI * 2;
    const pr = project(orbitPoint(o.r, o.tiltY, th), wobble);
    if (pr.z > 0) {
      if (!started) { ctx.moveTo(pr.x, pr.y); started = true; }
      else ctx.lineTo(pr.x, pr.y);
    } else started = false; // 分段：z<=0 断开
  }
  ctx.stroke();
}
function drawOrbitBack(o, wobble, alpha) {
  ctx.beginPath();
  ctx.strokeStyle = `rgba(125, 211, 252, ${alpha * 0.75})`;
  ctx.lineWidth = 1.6;
  const STEPS = 72;
  let started = false;
  for (let i = 0; i <= STEPS; i++) {
    const th = (i / STEPS) * Math.PI * 2;
    const pr = project(orbitPoint(o.r, o.tiltY, th), wobble);
    if (pr.z <= 0) {
      if (!started) { ctx.moveTo(pr.x, pr.y); started = true; }
      else ctx.lineTo(pr.x, pr.y);
    } else started = false;
  }
  ctx.stroke();
}

// 电子：径向渐变球体（近大远小：大小 × 投影 scale）——传入投影结果（分层已排序）
function drawElectron(e) {
  const { o, pr } = e;
  const baseR = o.r > 90 ? 4.2 : 5;
  const r = baseR * pr.s;
  // 球体径向渐变（光源左上）
  const g = ctx.createRadialGradient(pr.x - r * 0.35, pr.y - r * 0.35, r * 0.15, pr.x, pr.y, r);
  g.addColorStop(0, '#7dd3fc');
  g.addColorStop(0.55, '#0ea5e9');
  g.addColorStop(1, '#075985');
  ctx.beginPath();
  ctx.arc(pr.x, pr.y, r, 0, Math.PI * 2);
  ctx.fillStyle = g;
  ctx.fill();
  // 辉光
  ctx.beginPath();
  ctx.arc(pr.x, pr.y, r * 2.1, 0, Math.PI * 2);
  ctx.fillStyle = `rgba(14, 165, 233, ${0.22 * pr.s})`;
  ctx.fill();
}

// 核（眼睛）：虹膜 + 瞳孔（环顾）+ 高光（固定）+ 辉光（呼吸）
function drawNucleus(s) {
  const glow = 0.5 + 0.5 * Math.sin(s * 2.4); // 呼吸 0..1
  // 辉光（径向渐变大圆）
  const gg = ctx.createRadialGradient(CX, CY, NUCLEUS_R * 0.4, CX, CY, NUCLEUS_R * 2.2);
  gg.addColorStop(0, `rgba(14, 165, 233, ${0.38 * glow})`);
  gg.addColorStop(1, 'rgba(14, 165, 233, 0)');
  ctx.beginPath(); ctx.arc(CX, CY, NUCLEUS_R * 2.2, 0, Math.PI * 2); ctx.fillStyle = gg; ctx.fill();

  // 虹膜（球面渐变 + 描边）
  const ig = ctx.createRadialGradient(CX - 8, CY - 9, 3, CX, CY, NUCLEUS_R);
  ig.addColorStop(0, '#0b4a75');
  ig.addColorStop(0.55, '#0369a1');
  ig.addColorStop(1, '#075985');
  ctx.beginPath(); ctx.arc(CX, CY, NUCLEUS_R, 0, Math.PI * 2);
  ctx.fillStyle = ig; ctx.fill();
  ctx.strokeStyle = 'rgba(56, 189, 248, 0.35)'; ctx.lineWidth = 1; ctx.stroke();

  // 瞳孔（环顾扫视：椭圆轨迹，不同频率的 sin/cos 组合 = 到处看）
  const px = CX + Math.sin(s * 0.9) * 9;
  const py = CY + Math.cos(s * 1.3) * 9;
  const pg = ctx.createRadialGradient(px - 3, py - 3, 2, px, py, PUPIL_R);
  pg.addColorStop(0, '#38bdf8');
  pg.addColorStop(0.6, '#0ea5e9');
  pg.addColorStop(1, '#0284c7');
  ctx.beginPath(); ctx.arc(px, py, PUPIL_R, 0, Math.PI * 2); ctx.fillStyle = pg; ctx.fill();

  // 高光（固定左上，光源不动）
  ctx.beginPath(); ctx.arc(CX + GLINT_X, CY + GLINT_Y, 4.5, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.95)'; ctx.fill();
  ctx.beginPath(); ctx.arc(CX + GLINT_X, CY + GLINT_Y, 7, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.18)'; ctx.fill();
}

// 底座（全息投影盘）：与核辉光同步闪烁
function drawBase(s, glow) {
  const g = ctx.createRadialGradient(CX, CY + 108, 5, CX, CY + 108, 66);
  g.addColorStop(0, `rgba(56, 189, 248, ${0.14 * (0.6 + 0.4 * glow)})`);
  g.addColorStop(1, 'rgba(56, 189, 248, 0)');
  ctx.beginPath(); ctx.ellipse(CX, CY + 108, 66, 13, 0, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
}

// 主渲染循环：分层绘制（后段轨道+电子 → 核 → 前段电子+轨道）
let start = performance.now();
function frame(now) {
  const s = (now - start) / 1000;
  ctx.clearRect(0, 0, W, H);
  const wobble = Math.sin(s * 0.52) * WOBBLE_AMP; // 整体摇摆
  const glow = 0.5 + 0.5 * Math.sin(s * 2.4);     // 核辉光呼吸（0..1）
  const orbitAlpha = 0.3 + 0.3 * glow;            // 轨道呼吸与核同步

  drawBase(s, glow);
  // 收集全部电子（投影 + z）→ 分层：后段（z<=0）先画在核下，前段（z>0）后画在核上
  const backE = [], frontE = [];
  for (const o of ORBITS) {
    drawOrbitBack(o, wobble, orbitAlpha);
    for (let i = 0; i < o.n; i++) {
      const th = o.phase + s * o.speed + (i / o.n) * Math.PI * 2;
      const pr = project(orbitPoint(o.r, o.tiltY, th), wobble);
      (pr.z <= 0 ? backE : frontE).push({ o, pr });
    }
  }
  // ① 后段电子（在核后面，先画）
  for (const e of backE) drawElectron(e);
  // ② 核（眼睛）
  drawNucleus(s);
  // ③ 前段电子（在核前面，后画）
  for (const e of frontE) drawElectron(e);
  // ④ 轨道前半段（z>0，最后画在核上）
  for (const o of ORBITS) drawOrbit(o, wobble, orbitAlpha);

requestAnimationFrame(frame);

// ═══════════ 终端日志 + 进度条（模拟启动串行链）═══════════
const STAGES = [
  { text: '载入本地配置…', decor: false, pct: 12 },
  { text: '$ fractal init --core v0.1.0', decor: true, pct: 18 },
  { text: '配置就绪', decor: false, pct: 30 },
  { text: '$ opencode serve --port 51888', decor: true, pct: 38 },
  { text: '启动引擎 serve…', decor: false, pct: 45 },
  { text: '[ok] 校验引擎完整性 sha256 … 通过', decor: true, pct: 55 },
  { text: '引擎就绪 · 事件流已连接', decor: false, pct: 70 },
  { text: '[ok] 建立事件通道 … connected', decor: true, pct: 76 },
  { text: '加载会话列表…', decor: false, pct: 82 },
  { text: '[ok] 索引记忆区块 … 42 blocks', decor: true, pct: 88 },
  { text: '[ok] 恢复工作区 … fractal', decor: true, pct: 94 },
  { text: '分形核心已就绪', decor: false, pct: 100 },
];
const term = document.getElementById('term');
const pfill = document.getElementById('pfill');
const ppct = document.getElementById('ppct');
let logTimer = null;

function pushLine(text, decor) {
  const line = document.createElement('div');
  line.className = 'boot-line' + (decor ? ' boot-line--decor' : '');
  const caret = document.createElement('span');
  caret.className = 'boot-caret' + (decor ? '' : ' boot-caret--accent');
  caret.textContent = decor ? '›' : '▶';
  line.appendChild(caret);
  line.appendChild(document.createTextNode(text));
  term.insertBefore(line, term.querySelector('.boot-cursor'));
  const lines = term.querySelectorAll('.boot-line');
  if (lines.length > 7) term.removeChild(lines[0]);
}

function replay() {
  clearTimeout(logTimer);
  term.querySelectorAll('.boot-line').forEach((l) => l.remove());
  pfill.style.width = '0%';
  ppct.textContent = '0%';
  let i = 0;
  (function next() {
    if (i >= STAGES.length) return;
    const st = STAGES[i++];
    pushLine(st.text, st.decor);
    pfill.style.width = st.pct + '%';
    ppct.textContent = st.pct + '%';
    logTimer = setTimeout(next, st.decor ? 260 : 520);
  })();
}
replay();
}
requestAnimationFrame(frame);
</script>
</body>
</html>
