<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>分形 Logo · 硅原子方向</title>
<style>
  body { font-family: "Microsoft YaHei", sans-serif; background: #0f1117; color: #e8eaf0; margin: 0; padding: 40px; }
  h1 { font-size: 22px; margin-bottom: 8px; }
  .sub { color: #8b93a7; font-size: 13px; margin-bottom: 32px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; max-width: 1100px; }
  .card { background: #161a23; border: 1px solid #262c3a; border-radius: 16px; padding: 20px; }
  .card h2 { font-size: 15px; margin: 0 0 4px; }
  .card .desc { font-size: 12px; color: #8b93a7; line-height: 1.6; margin-bottom: 16px; }
  .preview { display: flex; gap: 14px; align-items: center; margin-top: 12px; }
  .dark-bg { background: #0f1117; border-radius: 10px; padding: 8px; }
  .light-bg { background: #f6f7f9; border-radius: 10px; padding: 8px; }
  .label { font-size: 10px; color: #5b6374; }
  img.big { width: 128px; height: 128px; }
  img.mid { width: 48px; height: 48px; }
  img.small { width: 24px; height: 24px; }
</style></head><body>
<h1>分形 Logo · 硅原子方向（亮色主题天蓝）</h1>
<div class="sub">硅 = 芯片与数字世界的基石 · 玻尔模型：核（14p+14n）+ 三层轨道 + 电子 2-8-4</div>
<div class="grid">
<div class="card">
  <h2>S1 · 亮底标准</h2><div class="desc">浅灰底 #f6f7f9 + 天蓝轨道/电子 + 深天蓝核内「Si」——完整玻尔模型（2-8-4 共 14 电子）</div>
  <img class="big" src="candidates4/s1-standard.svg"/>
  <div class="preview">
    <div class="dark-bg"><img class="mid" src="candidates4/s1-standard.svg"/></div>
    <div class="light-bg"><img class="mid" src="candidates4/s1-standard.svg"/></div>
    <div class="dark-bg"><img class="small" src="candidates4/s1-standard.svg"/></div>
    <span class="label">暗底 / 亮底 / 小尺寸</span>
  </div>
</div>
<div class="card">
  <h2>S2 · 亮底极简</h2><div class="desc">纯白底 + 核双圆层次 + 无文字，更干净现代</div>
  <img class="big" src="candidates4/s2-minimal.svg"/>
  <div class="preview">
    <div class="dark-bg"><img class="mid" src="candidates4/s2-minimal.svg"/></div>
    <div class="light-bg"><img class="mid" src="candidates4/s2-minimal.svg"/></div>
    <div class="dark-bg"><img class="small" src="candidates4/s2-minimal.svg"/></div>
    <span class="label">暗底 / 亮底 / 小尺寸</span>
  </div>
</div>
<div class="card">
  <h2>S3 · 深底对照</h2><div class="desc">暗底 #1a1a2e + 天蓝——与暗色主题一致（对照组）</div>
  <img class="big" src="candidates4/s3-dark.svg"/>
  <div class="preview">
    <div class="dark-bg"><img class="mid" src="candidates4/s3-dark.svg"/></div>
    <div class="light-bg"><img class="mid" src="candidates4/s3-dark.svg"/></div>
    <div class="dark-bg"><img class="small" src="candidates4/s3-dark.svg"/></div>
    <span class="label">暗底 / 亮底 / 小尺寸</span>
  </div>
</div>
</div>
<div class="sub" style="margin-top:28px">选定后可叠加水面镜像错位效果</div>
</body></html>
