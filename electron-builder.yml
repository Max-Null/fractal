appId: com.oc-gui.app
productName: 分形
directories:
  buildResources: build
files:
  # 显式正向包含：覆盖 .gitignore 对 out/ 的排除（electron-builder 遵循 gitignore，
  # 无正向模式时构建产物 out/** 会被排除导致入口缺失）
  - '**/*'
  - '!**/.vscode/*'
  - '!src/**'
  - '!electron/**'
  - '!resources/bin/**'
  - '!stage0/**'
  - '!docs/**'
  - '!.playwright-mcp/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # asar 瘦身：renderer-only 依赖已移入 devDependencies（electron-builder 只打包 dependencies），
  # 此文件无需再逐个排除 node_modules——但 out/ 必须显式包含（上方 '**/*'）
  # locales 裁剪：只保留中/英文两个 pak（electronLanguages 限制打包语言）
electronLanguages:
  - zh-CN
  - en-US
asarUnpack:
  - resources/icon.png
  - resources/icons/**
extraResources:
  # sidecar：内置 opencode 二进制（scripts/download-opencode.js 下载）——打包后 process.resourcesPath/bin/
  - from: resources/bin
    to: bin
    filter:
      - '**/*'
  # 预置包：oc-plus 全家桶（agents/skills/plugins/preset.json）——打包后 process.resourcesPath/preset/
  # electron/main/preset.ts getDefaultPresetRoot 经 process.resourcesPath 定位；electron/** 源码不打包，必须显式携带
  - from: electron/resources/preset
    to: preset
    filter:
      - '**/*'
# locales 裁剪（顶层 files 已含排除规则，win 不再重复定义）
win:
  executableName: oc-gui
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  # 辅助安装器（向导模式）：默认 oneClick=true 是一键安装，无任何选项页；
  # 安装路径选择与快捷方式复选框均依赖此开关（electron.build/docs/nsis 查证）
  oneClick: false
  # 安装路径可配置：向导显示目录选择页（assisted installer only，默认 false）
  allowToChangeInstallationDirectory: true
  # 桌面快捷方式：true=向导显示复选框（默认勾选，用户可取消）；always=强制创建无选项（原配置）
  createDesktopShortcut: true
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  # 自动更新：GitHub Releases（仓库已转 public，electron-updater 零 token 直读；打包自动生成 latest.yml，--publish always 上传）
  provider: github
  owner: Max-Null
  repo: fractal
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
